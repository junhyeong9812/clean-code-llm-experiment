server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: god
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/ccle_god}
    username: ${DB_USER:ccle}
    password: ${DB_PASSWORD:ccle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
